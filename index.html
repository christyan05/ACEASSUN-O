                    <div class="canto-saber text-lg leading-relaxed space-y-6 text-gray-800">
                        <p>O trabalho do Agente de Combate às Endemias (ACE) no controle das arboviroses é a linha de frente da saúde pública municipal. Arboviroses são doenças causadas por vírus transmitidos por artrópodes, sendo o mosquito <span class="hl-word">Aedes aegypti</span> o principal vetor urbano no Brasil. Este vetor é caracterizado por ser <span class="hl-concept">estritamente diurno</span> (maior atividade no início da manhã e fim da tarde), <span class="hl-concept">altamente antropofílico</span> (prefere sangue humano) e <span class="hl-concept">sinantrópico</span> (vive em estreita associação com o ser humano, dentro e ao redor das residências).</p>
                        
                        <h3 class="text-2xl font-bold text-slate-900 mt-8 border-b-2 border-blue-200 pb-2">O Ciclo do Aedes aegypti</h3>
                        <p>O ciclo de vida compreende quatro fases: <span class="font-bold">Ovo, Larva, Pupa e Adulto (Alado)</span>. Um detalhe crucial para o ACE: a fêmea não põe os ovos diretamente na água, mas sim nas <span class="hl-word">paredes internas úmidas</span> dos recipientes, milímetros acima do nível da água. Esses ovos têm uma incrível capacidade de resistência à dessecação, podendo sobreviver por mais de <span class="hl-concept">um ano (cerca de 450 dias)</span> em ambiente seco, eclodindo rapidamente quando entram em contato com água novamente. Por isso, a <span class="font-bold">eliminação mecânica</span> de criadouros (lavar, esfregar, tampar, descartar) é a medida preventiva primária e mais eficaz.</p>

                        <h3 class="text-2xl font-bold text-slate-900 mt-8 border-b-2 border-blue-200 pb-2">Dengue: Clínica e Gravidade</h3>
                        <p>A Dengue é uma doença febril aguda grave, causada por quatro sorotipos distintos (<span class="font-bold">DENV-1, DENV-2, DENV-3 e DENV-4</span>). A infecção confere imunidade permanente apenas para o sorotipo causador (homóloga) e temporária para os demais (heteróloga). A reinfecção por um sorotipo diferente aumenta o risco de formas graves. O Ministério da Saúde alerta para os <span class="hl-word">Sinais de Alarme</span>, que indicam o agravamento da doença (fase de extravasamento de plasma): <span class="font-bold">dor abdominal intensa e contínua</span>, vômitos persistentes, acúmulo de líquidos (ascite, derrame pleural), letargia ou irritabilidade e sangramento de mucosas.</p>

                        <h3 class="text-2xl font-bold text-slate-900 mt-8 border-b-2 border-blue-200 pb-2">Zika Vírus e suas Complicações</h3>

                        <h3 class="text-2xl font-bold text-slate-900 mt-8 border-b-2 border-blue-200 pb-2">Chikungunya e a Dor Articular</h3>
                        <p>A Chikungunya é marcada pela fase aguda com febre de início súbito e a característica <span class="hl-word">poliartralgia intensa</span> (dores fortes em várias articulações), geralmente bilateral e simétrica, que pode incapacitar o indivíduo. A letalidade na fase aguda é menor que na Dengue, mas a doença tem um alto potencial de cronificação, com as dores articulares persistindo por meses ou anos na fase subaguda e crônica.</p>

                teoria: `
                    <div class="canto-saber text-lg leading-relaxed space-y-6 text-gray-800">
                        <p>A prova de Português da Ápice Consultoria exige, antes de tudo, que você saiba diferenciar <span class="hl-concept">Compreensão</span> de <span class="hl-concept">Interpretação</span>. Embora pareçam sinônimos no dia a dia, para a banca são habilidades distintas. Compreender um texto é entender o que está <strong>escrito nele</strong>, na superfície. Interpretar é inferir o que está <strong>nas entrelinhas</strong>, o que o autor quis dizer.</p>
                        
                        <h3 class="text-2xl font-bold text-slate-900 mt-8 border-b-2 border-blue-200 pb-2">Compreensão Textual (O que está no texto)</h3>
                        <p>A compreensão foca na informação objetiva. A banca usa comandos no enunciado como: "Segundo o texto...", "O autor afirma que...", "De acordo com o texto...". A resposta <strong>deve estar literalmente escrita</strong> ou parafraseada no texto. Se você ler com atenção, vai apontar o dedo para a resposta no parágrafo.</p>

                        <h3 class="text-2xl font-bold text-slate-900 mt-8 border-b-2 border-blue-200 pb-2">Interpretação Textual (O que está além do texto)</h3>
                        <p>A interpretação exige que você tire conclusões, faça deduções (inferências) a partir do que leu. A banca usa comandos como: "Infere-se do texto que...", "O texto sugere que...", "Conclui-se que...". A resposta <strong>não estará escrita com todas as letras</strong>, mas o texto te dá pistas seguras para chegar àquela conclusão. O cuidado aqui é não "extrapolar" ou "viajar" e achar coisas que o texto não suporta.</p>

                        <h3 class="text-2xl font-bold text-slate-900 mt-8 border-b-2 border-blue-200 pb-2">Erros Clássicos na Interpretação</h3>
                        <p>As bancas criam alternativas falsas usando três estratégias principais:</p>
                        <ul class="list-disc pl-8 space-y-2 mt-4">
                            <li><span class="font-bold text-red-600">Extrapolação:</span> A alternativa diz mais do que o texto. Você adiciona informações que não estão lá.</li>
                            <li><span class="font-bold text-red-600">Redução:</span> A alternativa foca em apenas um detalhe ou uma exceção e trata como se fosse a ideia central de todo o texto.</li>
                            <li><span class="font-bold text-red-600">Contradição:</span> A alternativa diz exatamente o oposto do que o texto defende, muitas vezes mudando apenas uma palavra (como "não", "nunca", "sempre").</li>
                        </ul>
                    </div>

                     <div class="canto-saber text-lg leading-relaxed space-y-6 text-gray-800">
                        <p>A Leishmaniose é uma das doenças negligenciadas de maior impacto no Brasil, sendo dividida em duas formas clínicas principais que você, futuro ACE, precisa dominar: a <span class="hl-word">Leishmaniose Visceral (LV)</span>, também chamada de Calazar, e a <span class="hl-word">Leishmaniose Tegumentar Americana (LTA)</span>. Ambas são causadas por protozoários do gênero <em>Leishmania</em> e transmitidas pela picada de insetos flebotomíneos, conhecidos popularmente como <span class="hl-concept">mosquito-palha, tatuquira ou birigui</span>.</p>
                        
                        <h3 class="text-2xl font-bold text-slate-900 mt-8 border-b-2 border-blue-200 pb-2">O Vetor: Lutzomyia longipalpis</h3>
                        <p>Diferente do <em>Aedes aegypti</em>, o mosquito-palha (principal espécie no Brasil: <em>Lutzomyia longipalpis</em> para LV) não se desenvolve na água. Suas fêmeas põem os ovos em locais <span class="font-bold">úmidos, sombreados e ricos em matéria orgânica em decomposição</span>, como frestas de pedras, troncos de árvores, folhas secas no chão e, muito importante no ambiente periurbano, em <span class="hl-concept">galinheiros, chiqueiros e canis</span>. São insetos muito pequenos, de voo curto e silencioso, mais ativos no <span class="hl-word">crepúsculo e à noite</span>.</p>

                        <h3 class="text-2xl font-bold text-slate-900 mt-8 border-b-2 border-blue-200 pb-2">Leishmaniose Visceral (Calazar)</h3>
                        <p>A LV é a forma mais grave. O agente etiológico principal é a <em>Leishmania infantum</em>. Ela ataca os órgãos internos (visceras), principalmente <span class="font-bold">fígado, baço e medula óssea</span>. A tríade clássica de sintomas é: febre de longa duração, emagrecimento e <span class="hl-concept">hepatoesplenomegalia</span> (aumento do fígado e do baço, deixando o abdômen distendido). O grande desafio epidemiológico da LV no ambiente urbano é o <span class="hl-word">cão</span>, que atua como o principal reservatório do parasito. Um cão infectado pode estar assintomático ou apresentar emagrecimento, queda de pelo, feridas crônicas e crescimento exagerado das unhas (onicogrifose).</p>

                        <h3 class="text-2xl font-bold text-slate-900 mt-8 border-b-2 border-blue-200 pb-2">Leishmaniose Tegumentar Americana (LTA)</h3>
                        <p>A LTA afeta a pele e as mucosas (nariz, boca). Diversas espécies de <em>Leishmania</em> podem causá-la (ex: <em>L. braziliensis</em>). O sinal clínico inicial clássico é a "úlcera de Bauru" ou "ferida brava", uma <span class="hl-concept">ferida na pele com bordas elevadas (moldura) e fundo avermelhado/granuloso</span>, geralmente indolor. Meses ou anos após a cicatrizazção, podem surgir lesões destrutivas nas mucosas, principalmente no septo nasal. O reservatório da LTA é mais silvestre (roedores, marsupiais, preguiças), mas cães e equídeos podem se infectar (hospedeiros acidentais).</p>

                        <h3 class="text-2xl font-bold text-slate-900 mt-8 border-b-2 border-blue-200 pb-2">Prevenção e Controle</h3>
                        <p>O foco do ACE é o controle do vetor e do reservatório (na LV). A <span class="hl-word">limpeza de quintais e terrenos</span> (manejo ambiental) recolhendo folhas, fezes de animais e restos de comida é vital, pois elimina os criadouros do mosquito-palha. A posse responsável de cães, o uso de coleiras repelentes e a realização de inquéritos sorológicos caninos são estratégias importantes contra a LV. Diferente da Dengue, a eutanásia de cães positivos para LV é uma recomendação em saúde pública, dado o risco de transmissão.</p>
                    </div>

                     <div class="canto-saber text-lg leading-relaxed space-y-6 text-gray-800">
                        <p>No estudo da Informática Básica para concursos, a primeira distinção fundamental é entender de que é feito um computador. A máquina é dividida em duas grandes partes inseparáveis: o <span class="hl-word">Hardware</span> (a parte física, dura, que você pode tocar e chutar) e o <span class="hl-concept">Software</span> (a parte lógica, os programas, que você não toca, mas vê na tela).</p>
                        
                        <h3 class="text-2xl font-bold text-slate-900 mt-8 border-b-2 border-blue-200 pb-2">Hardware: Componentes e Periféricos</h3>
                        <p>O cérebro do computador é o <span class="font-bold">Processador (CPU - Central Processing Unit)</span>, responsável por calcular e executar as ordens. Ele se apoia nas memórias: a <span class="hl-word">Memória RAM</span>, que é a mesa de trabalho do processador (volátil, apaga tudo quando desliga), e a <span class="hl-concept">Memória ROM</span> (já vem de fábrica, não volátil). Para guardar seus arquivos (fotos, edital, planilhas), você usa a Memória Secundária ou de Massa, como o <span class="font-bold">Disco Rígido (HD) ou o SSD</span>.</p>
                        
                        <p>Os aparelhos conectados ao computador são chamados de <span class="font-bold">Periféricos</span>. Eles são classificados por como a informação viaja:</p>
                        <ul class="list-disc pl-8 space-y-2 mt-2">
                            <li><strong>Entrada (Input):</strong> A informação vai do usuário para a máquina (Teclado, Mouse, Scanner, Microfone).</li>

                        <h3 class="text-2xl font-bold text-slate-900 mt-8 border-b-2 border-blue-200 pb-2">Software: O Espírito da Máquina</h3>
                        <p>Softwares são os programas. O principal deles é o <span class="hl-word">Sistema Operacional (SO)</span> (ex: Windows, Linux, Android). O SO é o gerente do computador, ele controla o hardware e permite que os outros programas funcionem. Sem ele, o computador é só sucata inútil.</p>
                        <p>Temos também os <span class="hl-concept">Softwares Aplicativos</span>, que são aqueles usados para tarefas específicas do dia a dia (ex: Word para textos, Excel para planilhas, Google Chrome para navegar na internet, WhatsApp).</p>

                    <div class="canto-saber text-lg leading-relaxed space-y-6 text-gray-800">
                        <p>O servidor municipal não pode iniciar sua jornada sem conhecer a "Constituição" de sua cidade: a <span class="hl-word">Lei Orgânica Municipal (LOM)</span>. O edital de Assunção cobra o domínio desta lei. Segundo o Art. 1º, Assunção é uma entidade pública dotada de autonomia política, administrativa e financeira. Os poderes do Município são o Legislativo e o Executivo, sendo independentes e <span class="hl-concept">colaborativos (harmônicos)</span> entre si.</p>
                        
                        <h3 class="text-2xl font-bold text-slate-900 mt-8 border-b-2 border-blue-200 pb-2">O Poder Legislativo (Câmara Municipal)</h3>
                        <p>O Poder Legislativo em Assunção é exercido pela Câmara Municipal, composta por <span class="font-bold text-red-600">09 (nove) Vereadores</span>. É vital lembrar dos impedimentos: desde a expedição do diploma, o vereador não pode firmar contratos com a administração pública municipal, salvo com cláusulas uniformes. A Câmara tem a função principal de legislar (tributos, orçamento, código de obras) e fiscalizar o Executivo. A <span class="hl-word">iniciativa popular</span> de projetos de lei exige a manifestação de pelo menos <span class="font-bold">5% do eleitorado</span> interessado.</p>

                        <h3 class="text-2xl font-bold text-slate-900 mt-8 border-b-2 border-blue-200 pb-2">O Processo Legislativo e o Prefeito</h3>
                        <p>A Lei Orgânica só pode ser alterada pelo voto de <span class="hl-concept">2/3 dos membros da Câmara</span>. Já os projetos de lei comuns precisam ser sancionados (aprovados) ou vetados pelo Prefeito. Se o Prefeito vetar, a Câmara pode rejeitar esse veto com o voto da <span class="font-bold">maioria absoluta</span>. Atenção exclusiva: projetos de lei que criam cargos na Prefeitura, aumentam salários ou falam do regime dos servidores (como você) são de <span class="hl-word">iniciativa exclusiva do Prefeito</span>. Nenhum vereador pode propor isso.</p>

                        <h3 class="text-2xl font-bold text-slate-900 mt-8 border-b-2 border-blue-200 pb-2">Plebiscito</h3>
                        <p>Uma ferramenta forte de democracia participativa é o Plebiscito (Art. 40). Questões relevantes (como mudar o nome da cidade) podem ir à votação popular se <span class="hl-concept">2/5 dos vereadores ou 5% dos eleitores</span> propuserem, e for aprovado por 2/3 da Câmara. O resultado do plebiscito <span class="font-bold">vincula</span> o poder público, ou seja, o Prefeito tem que obedecer.</p>
                        
                        <h3 class="text-2xl font-bold text-slate-900 mt-8 border-b-2 border-blue-200 pb-2">O Poder Executivo e as Infrações Político-Administrativas</h3>
                        <p>O Prefeito e o Vice são eleitos para 4 anos e precisam tomar posse até 10 dias da data fixada, ou perdem o cargo. Se ambos faltarem, quem assume é o <span class="hl-word">Presidente da Câmara</span>. Se a vacância ocorrer nos últimos 1/4 do mandato, o Presidente da Câmara completa o mandato. O Prefeito pode ser julgado pelo Tribunal de Justiça em crimes comuns, e pela <span class="hl-concept">Câmara Municipal</span> em infrações político-administrativas (ex: não publicar leis, não prestar contas). A cassação exige o voto de <span class="font-bold">2/3 dos vereadores</span>.</p>

                        <p>Neste sábado, o foco não é aprender conteúdo novo, mas sim consolidar o que foi estudado na Semana 1. A ciência da aprendizagem mostra que reler textos de forma passiva gera uma falsa sensação de fluência. A técnica mais poderosa para a aprovação é o <span class="hl-word">Active Recall</span> (Recordação Ativa), que força o seu cérebro a "puxar" a informação da memória antes de ver a resposta.</p>
                        
                        <h3 class="text-2xl font-bold text-slate-900 mt-8 border-b-2 border-blue-200 pb-2">O Ciclo do Aedes aegypti e Leishmaniose</h3>
                        <p>O mosquito da dengue põe seus ovos nas <span class="font-bold">paredes dos recipientes</span>, não na água. O ovo resiste mais de um ano. A pupa <span class="hl-concept">não se alimenta</span>. Apenas a fêmea pica. Já o vetor da Leishmaniose, o mosquito-palha, precisa de <span class="hl-word">terra úmida e matéria orgânica</span> (fezes, folhas). A Leishmaniose Visceral afeta órgãos internos (esplenomegalia) e tem o <span class="font-bold text-red-600">cão</span> como principal reservatório urbano. A Leishmaniose Tegumentar afeta pele (úlcera) e mucosas.</p>

                        <h3 class="text-2xl font-bold text-slate-900 mt-8 border-b-2 border-blue-200 pb-2">Informática: Hardware e Memórias</h3>
                        <p>Hardware é a peça física. <span class="font-bold">RAM</span> é a memória volátil (perde tudo se desligar), funciona como área de trabalho. O disco rígido (<span class="hl-concept">HD</span>) ou SSD é a memória não-volátil (armazena os dados). O processador (<span class="hl-word">CPU</span>) calcula. Scanners são periféricos de <span class="font-bold">entrada</span>; monitores, de <span class="font-bold">saída</span>. Pen drives são <span class="font-bold">mistos</span>. Softwares são os programas; o <span class="hl-concept">Sistema Operacional</span> é o mais importante.</p>
                        
                        <h3 class="text-2xl font-bold text-slate-900 mt-8 border-b-2 border-blue-200 pb-2">Português: Compreensão x Interpretação</h3>
                        <p>Compreender é entender o que está <span class="font-bold">escrito na superfície</span> ("Segundo o texto"). Interpretar é deduzir o que está nas <span class="hl-word">entrelinhas</span> ("Infere-se que"). Cuidado com extrapolações (ir além do texto), reduções (focar no irrelevante) e contradições (marcar o oposto). Desconfie de palavras absolutas ("sempre", "nunca").</p>

                        <h3 class="text-2xl font-bold text-slate-900 mt-8 border-b-2 border-blue-200 pb-2">Legislação: Lei Orgânica</h3>
                        <p>A Câmara de Assunção possui <span class="font-bold text-red-600">09 vereadores</span>. Emendas à LOM e cassações exigem <span class="hl-concept">2/3 dos votos</span>. Projetos para criar cargos no executivo são de iniciativa <span class="hl-word">exclusiva do Prefeito</span>. O Prefeito não pode se ausentar por mais de <span class="font-bold">15 dias</span> sem licença. Se ele e o vice faltarem, quem assume é o <span class="font-bold">Presidente da Câmara</span>.</p>

                    <div class="canto-saber text-lg leading-relaxed space-y-6 text-gray-800">
                        <p>Iniciando a segunda semana, o ACE deve mergulhar em duas endemias clássicas brasileiras, intimamente ligadas a moradias precárias e falta de saneamento: a <span class="hl-word">Doença de Chagas</span> e a <span class="hl-concept">Esquistossomose</span>. Ambas possuem ciclos de transmissão complexos que envolvem vetores e hospedeiros intermediários específicos.</p>
                        
                        <h3 class="text-2xl font-bold text-slate-900 mt-8 border-b-2 border-blue-200 pb-2">Doença de Chagas (Tripanossomíase Americana)</h3>
                        <p>O agente causador é o protozoário <span class="font-bold">Trypanosoma cruzi</span>. O principal vetor no Brasil é o inseto triatomíneo, conhecido como <span class="hl-concept">barbeiro, chupança ou chupão</span> (gêneros *Triatoma*, *Panstrongylus*, etc.). O barbeiro esconde-se em frestas de paredes de pau a pique, casas de taipa, ninhos de aves e palmeiras (açaí, babaçu). Ele possui hábitos <span class="hl-word">noturnos e hematófagos</span> em ambos os sexos e em todas as fases evolutivas.</p>
                        <p><strong>A transmissão clássica NÃO É PELA PICADA!</strong> O barbeiro pica o rosto da pessoa dormindo, suga o sangue, enche a barriga e <span class="hl-word">defeca próximo ao local da picada</span>. As fezes contêm o parasita. A pessoa coça o local e esfrega as fezes na ferida ou nas mucosas (olho, boca), infectando-se. Outras vias cruciais hoje são a transmissão <span class="hl-concept">oral (ingestão de caldo de cana ou açaí moído com o inseto)</span> e a congênita (mãe para filho).</p>
                        <p>Sintomas: A fase aguda pode ter febre e inchaço no olho onde houve a infecção (Sinal de Romaña). A fase crônica, que pode durar décadas, afeta gravemente o <span class="font-bold text-red-600">coração (cardiomegalia e arritmias) e o sistema digestivo (megacólon e megaesôfago)</span>.</p>

                        <h3 class="text-2xl font-bold text-slate-900 mt-8 border-b-2 border-blue-200 pb-2">Esquistossomose (Xistose ou Barriga d'Água)</h3>
                        <p>Causada pelo platelminto (verme) <span class="font-bold">Schistosoma mansoni</span>. A transmissão está ligada ao <span class="hl-concept">ciclo da água e falta de esgoto</span>. A pessoa infectada libera ovos nas fezes. Se não houver saneamento, essas fezes chegam aos rios e lagos doces (coleções hídricas de pouca correnteza). Na água, o ovo eclode e libera o miracídio, que penetra obrigatóriamente em um hospedeiro intermediário: o <span class="hl-word">caramujo do gênero Biomphalaria</span> (planorbídeos).</p>
                        <p>Dentro do caramujo, ele se multiplica e sai para a água na forma de <span class="font-bold">cercária</span>. A cercária <span class="hl-concept">penetra ATIVAMENTE na pele íntegra</span> de pessoas que tomam banho, lavam roupas ou brincam nessas águas (não precisa picar, nem de ferida, ela perfura a pele). Sintomas crônicos incluem fibrose hepática, hipertensão portal, sangue nas fezes e a ascite gigante (barriga d'água).</p>
                    </div>

                    <div class="canto-saber text-lg leading-relaxed space-y-6 text-gray-800">
                        <p>O domínio da norma culta nas regras frias (Ortografia, Acentuação e Classes de Palavras) é onde muitos candidatos perdem pontos de bobeira. A banca Ápice adora misturar regras do <span class="hl-concept">Novo Acordo Ortográfico</span> em questões diretas. Vamos focar nos erros mais caros e nas certezas gramaticais.</p>
                        
                        <h3 class="text-2xl font-bold text-slate-900 mt-8 border-b-2 border-blue-200 pb-2">Acentuação: As Regras de Ouro</h3>
                        <p>Acentuam-se as <span class="hl-word">Proparoxítonas</span> (todas: <em>médico, lágrima, pássaro</em>). Acentuam-se as <span class="hl-word">Oxítonas</span> terminadas em A(s), E(s), O(s), EM, ENS (<em>cajá, café, cipó, armazém</em>). Acentuam-se as <span class="hl-word">Paroxítonas</span> (as mais cobradas) terminadas em: L, I(s), N, U(s), R, X, Ã(s), ÃO(s), UM(ns), PS e Ditongos (<em>fácil, júri, pólen, bônus, caráter, tórax, órfã, órgão, fórum, bíceps, memória</em>). Paroxítonas terminadas em 'A, E, O, EM, ENS' <strong>NÃO</strong> têm acento (ex: <em>mesa, pele, bolo, item, hifens</em>).</p>
                        
                        <p><strong>Atenção ao Novo Acordo (O que caiu):</strong></p>
                        <ul class="list-disc pl-8 space-y-2 mt-2">
                            <li>Ditongos abertos (EI, OI) nas <span class="font-bold text-red-600">paroxítonas</span> perderam o acento: i-dei-a, as-sem-blei-a, joi-a, he-roi-co.</li>
                            <li>(Mas continuam nas <span class="hl-concept">oxítonas</span>: a-néis, he-rói, cor-rói).</li>
                            <li>Vogais dobradas (EE, OO) perderam o acento: voo, enjoo, leem, deem, creem.</li>
                            <li>Acentos diferenciais que caíram: para (verbo parar), pelo (cabelo), pera (fruta).</li>
                            <li>Acentos diferenciais que <span class="font-bold">FICARAM</span>: pôde (verbo) / pode; pôr (verbo) / por (preposição); têm (plural) / tem (singular).</li>
                        </ul>

                        <h3 class="text-2xl font-bold text-slate-900 mt-8 border-b-2 border-blue-200 pb-2">O Temido Hífen</h3>
                        <p>Regra geral do Novo Acordo para prefixos: <span class="hl-concept">Letras iguais se atraem e batem (precisam do hífen)</span>: <em>micro-ondas, anti-inflamatório, contra-ataque</em>. <span class="hl-word">Letras diferentes se abraçam (juntam tudo)</span>: <em>autoescola, infraestrutura, semicírculo</em>.
                        <br><strong>Exceção da consoante R e S:</strong> Se a segunda palavra começar com R ou S e a primeira terminar em vogal, você junta e <span class="font-bold text-red-600">dobra o R/S</span>: <em>minissaia, ultrassom, autorretrato, antissocial</em>.</p>

                        <h3 class="text-2xl font-bold text-slate-900 mt-8 border-b-2 border-blue-200 pb-2">Morfologia Básica</h3>
                        <p>Você precisa bater o olho numa palavra e saber o que ela é. O <span class="font-bold">Substantivo</span> dá o nome. O <span class="font-bold">Adjetivo</span> dá a característica (qualifica o substantivo). O <span class="font-bold">Advérbio</span> é inflexível (não vai pro plural) e modifica um verbo, um adjetivo ou outro advérbio, indicando tempo, modo, lugar (ex: ele correu <em>rápido</em>, ela é <em>muito</em> inteligente). O <span class="font-bold">Pronome</span> substitui ou acompanha o nome. Cuidado com o advérbio 'MEIO' x numeral 'MEIO': "A porta está <em>meio</em> (advérbio=um pouco) aberta" x "Comi <em>meia</em> (numeral=metade) maçã".</p>

                    <div class="canto-saber text-lg leading-relaxed space-y-6 text-gray-800">
                        <p>A atuação do Agente de Combate às Endemias é diretamente vinculada a uma das maiores conquistas do SUS: a estruturação da Vigilância em Saúde. A <span class="hl-word">Vigilância Ambiental em Saúde (VAS)</span> é um conjunto de ações que proporcionam o conhecimento e a detecção de qualquer mudança nos fatores determinantes e condicionantes do meio ambiente que interferem na saúde humana.</p>
                        
                        <h3 class="text-2xl font-bold text-slate-900 mt-8 border-b-2 border-blue-200 pb-2">O Foco da Vigilância Ambiental</h3>
                        <p>O foco da VAS não é a "natureza selvagem" ou a proteção dos animais (isso é papel dos órgãos de Meio Ambiente e IBAMA). O foco é o <span class="hl-concept">ambiente onde o homem se insere e as variáveis que afetam a saúde HUMANA</span>. É uma abordagem essencialmente <span class="font-bold">antropocêntrica</span>. A VAS atua fortemente em duas frentes: riscos biológicos e riscos não-biológicos.</p>

                        <h3 class="text-2xl font-bold text-slate-900 mt-8 border-b-2 border-blue-200 pb-2">Matrizes Ambientais e Fatores de Risco</h3>
                        <ul class="list-disc pl-8 space-y-2 mt-2">
                            <li><span class="font-bold text-blue-600">VIGIÁGUA:</span> Monitora a qualidade da água para consumo humano. O foco principal é verificar níveis de cloro, turbidez, coliformes (bactérias fecais), garantindo a portabilidade da água na ponta (torneira).</li>
                            <li><span class="font-bold text-orange-600">VIGISOLO:</span> Monitora áreas de risco como aterros desativados, contaminação do solo por agrotóxicos e resíduos industriais, onde populações estão construindo moradias.</li>
                            <li><span class="font-bold text-green-600">VIGIAR:</span> Monitoramento da qualidade do ar (fumaça de queimadas, poluentes industriais, poeira) e seu impacto no aumento de doenças respiratórias crônicas e agudas na população.</li>
                            <li><span class="font-bold text-red-600">VIGIDESASTRES:</span> Prepara o setor da saúde para atuar antes, durante e após desastres naturais (enchentes, secas, deslizamentos) e desastres de origem tecnológica (rompimento de barragens, contaminação por radionuclídeos).</li>
                            <li><span class="font-bold text-purple-600">Fatores Biológicos (Animais):</span> Controle e monitoramento de Vetores (mosquitos, flebotomíneos, barbeiros, caramujos), Hospedeiros e Reservatórios, e Animais Peçonhentos (escorpiões, cobras, aranhas). Este é o "quartel-general" das funções diárias do ACE.</li>
                        </ul>

                        <h3 class="text-2xl font-bold text-slate-900 mt-8 border-b-2 border-blue-200 pb-2">A Lógica da Prevenção e Territorialização</h3>
                        <p>A VAS baseia seu trabalho no <span class="hl-concept">planejamento e mapeamento do território (Territorialização)</span>. O ACE não anda a esmo. A cidade é dividida em estratos de risco. Locais com lixo a céu aberto, saneamento precário e proximidade de matas têm prioridade nas ações mecânicas. A lógica é antecipar a doença eliminando a condição ambiental propícia ao seu surgimento.</p>
                    </div>

        };
        const app = {

                            </div>
                        </div>
                    </div>
                `;
            },

            viewCronograma() {
                let cardsHtml = '';
                cronogramaData.forEach(item => {
                    let icon, bgColor, barColor, action;
                    
                    if (item.tipo === 'teoria') {
                        icon = 'ph-book-open';

                        barColor = 'bg-blue-500';

                    } else if (item.tipo === 'revisao') {
                        icon = 'ph-cards';
                        bgColor = 'bg-purple-50';
                        barColor = 'bg-purple-500';
                        action = `onclick="app.openLesson(${item.id})"`;
                    } else if (item.tipo === 'simulado') {
                        icon = 'ph-exam';
                        bgColor = 'bg-red-50';
                        barColor = 'bg-red-500';
                        action = `onclick="app.openSimulado()"`;

                    cardsHtml += `

                });

                return `
                    <div class="fade-in space-y-8">
                        <div class="mb-8 border-b border-slate-200 pb-6">
                            <h1 class="text-4xl font-extrabold text-slate-900">Seu Cronograma de Elite</h1>
                            <p class="text-lg text-slate-600 mt-2">O caminho até a aprovação. Clique livremente nas aulas para adiantar seu estudo.</p>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            ${cardsHtml}
                        </div>
                    </div>
                `;
            },

            viewAula(lessonData) {
                let questoesHtml = '';
                
                lessonData.questoes.forEach((q, qIndex) => {
                    let badgeColor = q.dificuldade === 'Fácil' ? 'bg-green-100 text-green-800' : 
                                     q.dificuldade === 'Média' ? 'bg-yellow-100 text-yellow-800' : 
                                     'bg-red-100 text-red-800';

                    let optionsHtml = '';
                    q.opcoes.forEach((opt, optIndex) => {
                        optionsHtml += `
                            <div id="opt-${qIndex}-${optIndex}" class="relative flex items-start gap-4 p-5 border-2 border-slate-100 rounded-xl transition-all hover:border-blue-200 hover:bg-slate-50">
                                <!-- Botão de Eliminação (Tesourinha) -->
                                <button onclick="app.toggleEliminate(event, ${qIndex}, ${optIndex})" class="mt-0.5 text-slate-300 hover:text-red-500 transition-colors z-10" title="Eliminar/Restaurar alternativa">
                                    <i class="ph-bold ph-scissors text-2xl"></i>
                                </button>
                                
                                <!-- Corpo da Alternativa para clique de resposta -->
                                <div class="flex-1 flex gap-4 cursor-pointer pt-0.5" onclick="app.selectAnswer(${qIndex}, ${optIndex})">
                                    <span class="font-black text-slate-400 mt-0.5">${String.fromCharCode(65 + optIndex)}.</span>
                                    <span id="txt-${qIndex}-${optIndex}" class="text-slate-700 text-lg leading-relaxed transition-all">${opt.texto}</span>
                                </div>
                                
                                <!-- Ícone de feedback oculto -->
                                <div id="feedback-icon-${qIndex}-${optIndex}" class="hidden absolute right-4 top-4 text-3xl"></div>
                            </div>
                        `;
                    });

                    questoesHtml += `
                        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 mb-8" id="questao-card-${qIndex}">
                            <div class="flex justify-between items-center mb-6 border-b border-slate-100 pb-4">
                                <h4 class="font-black text-xl text-slate-900">Questão ${qIndex + 1}</h4>
                                <span class="px-3 py-1 rounded-md text-xs font-bold uppercase tracking-wider ${badgeColor}">${q.dificuldade}</span>
                            </div>
                            <p class="text-xl text-slate-800 font-semibold mb-8 leading-relaxed">${q.texto}</p>
                            <div class="space-y-3">
                                ${optionsHtml}
                            </div>
                            
                            <!-- Bloco de Explicação (Oculto inicialmente) -->
                            <div id="explicacao-container-${qIndex}" class="hidden mt-8 bg-slate-50 border-l-4 p-6 rounded-r-xl">
                                <div class="flex items-center gap-2 mb-3">
                                    <i class="ph-fill ph-chalkboard-teacher text-2xl text-slate-700"></i>
                                    <h5 class="font-bold text-slate-900 text-lg">Comentário do Mentor</h5>
                                </div>
                                <p id="explicacao-texto-${qIndex}" class="text-slate-700 text-lg leading-relaxed"></p>
                            </div>
                        </div>
                    `;
                });

                return `
                    <div class="fade-in max-w-4xl mx-auto pb-24">
                        
                        <!-- Header Dinâmico -->
                        <div class="bg-white rounded-3xl shadow-sm border border-slate-200 p-8 mb-10 relative overflow-hidden">
                            <div class="absolute top-0 left-0 w-full h-2 bg-slate-100">
                                <div class="h-full bg-green-500" style="width: ${lessonData.progresso}%"></div>
                            </div>
                            <div class="flex justify-between items-center mb-4">
                                <span class="text-xs font-bold text-blue-600 bg-blue-50 px-3 py-1 rounded-full uppercase tracking-wider">${lessonData.disciplina}</span>
                                <span class="text-sm text-slate-500 font-semibold">${lessonData.progresso}% do Edital Concluído</span>
                            </div>
                            <h1 class="text-4xl font-black text-slate-900 mb-6 leading-tight">${lessonData.tema}</h1>
                            <button onclick="app.switchTab('cronograma')" class="text-sm font-bold text-slate-500 hover:text-blue-600 transition-colors flex items-center gap-2"><i class="ph-bold ph-arrow-left"></i> Voltar ao Cronograma</button>
                        </div>

                        <!-- Teoria Profunda -->
                        <div class="mb-14">
                            <h2 class="text-3xl font-black text-slate-900 mb-6 flex items-center gap-3"><i class="ph-duotone ph-book-open text-blue-600 text-4xl"></i> Canto do Saber</h2>
                            <div class="bg-white rounded-3xl shadow-sm border border-slate-200 p-8 sm:p-10">
                                ${lessonData.teoria}
                            </div>
                        </div>

                        <!-- Dicas e Macetes -->
                        <div class="mb-14">
                            <h2 class="text-3xl font-black text-slate-900 mb-6 flex items-center gap-3"><i class="ph-duotone ph-treasure-chest text-yellow-500 text-4xl"></i> Cofre de Pérolas</h2>
                            <div class="bg-[#FFFBEB] rounded-3xl shadow-sm border border-yellow-200 p-8 sm:p-10">
                                ${lessonData.perolas}
                            </div>
                        </div>

                        <!-- Bateria de Exercícios -->
                        <div>
                            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
                                <h2 class="text-3xl font-black text-slate-900 flex items-center gap-3"><i class="ph-duotone ph-barbell text-red-600 text-4xl"></i> Praticando para Fixar</h2>
                                <span class="bg-slate-800 text-white font-bold px-4 py-2 rounded-lg text-sm self-start">15 Questões Inéditas</span>
                            </div>
                            
                            ${questoesHtml}

                            <div class="text-center mt-12">
                                <button onclick="app.finalizarAula()" class="bg-blue-600 hover:bg-blue-700 text-white font-black text-xl py-5 px-12 rounded-2xl shadow-xl transition-all transform hover:-translate-y-1 active:scale-95 w-full sm:w-auto">
                                    Finalizar e Ver Diagnóstico
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            },

            toggleEliminate(event, qIndex, optIndex) {
                event.stopPropagation(); // Impede que o clique acione a resposta
                if (this.respostas[qIndex] !== null) return; // Travado se já respondeu

                const txtEl = document.getElementById(`txt-${qIndex}-${optIndex}`);
                if (!this.eliminadas[qIndex]) this.eliminadas[qIndex] = [];

                const idx = this.eliminadas[qIndex].indexOf(optIndex);
                if (idx > -1) {
                    // Desfazer eliminação
                    this.eliminadas[qIndex].splice(idx, 1);
                    txtEl.classList.remove('option-eliminated');
                } else {
                    // Aplicar eliminação
                    this.eliminadas[qIndex].push(optIndex);
                    txtEl.classList.add('option-eliminated');
                }
            },

            selectAnswer(qIndex, optIndex) {
                if (this.respostas[qIndex] !== null) return; // Impede múltiplas respostas
                
                const question = aulasDatabase[this.currentLessonId].questoes[qIndex];
                this.respostas[qIndex] = optIndex;
                const isCorrect = question.opcoes[optIndex].correta;
                const correctIndex = question.opcoes.findIndex(o => o.correta);

                // Estilizar alternativas
                question.opcoes.forEach((opt, idx) => {
                    const divEl = document.getElementById(`opt-${qIndex}-${idx}`);
                    const txtEl = document.getElementById(`txt-${qIndex}-${idx}`);
                    const iconEl = document.getElementById(`feedback-icon-${qIndex}-${idx}`);
                    
                    // Limpar hovers
                    divEl.classList.remove('hover:border-blue-200', 'hover:bg-slate-50', 'cursor-pointer');
                    
                    if (idx === correctIndex) {
                        divEl.classList.add('border-green-500', 'bg-green-50');
                        txtEl.classList.add('text-green-800');
                        txtEl.classList.remove('option-eliminated');
                        iconEl.innerHTML = '<i class="ph-fill ph-check-circle text-green-500"></i>';
                        iconEl.classList.remove('hidden');
                    } else if (idx === optIndex && !isCorrect) {
                        divEl.classList.add('border-red-500', 'bg-red-50');
                        txtEl.classList.add('text-red-800');
                        txtEl.classList.remove('option-eliminated');
                        iconEl.innerHTML = '<i class="ph-fill ph-x-circle text-red-500"></i>';
                        iconEl.classList.remove('hidden');
                    } else {
                        divEl.classList.add('opacity-50');
                    }
                });

                // Mostrar Gabarito Comentado
                const expContainer = document.getElementById(`explicacao-container-${qIndex}`);
                const expText = document.getElementById(`explicacao-texto-${qIndex}`);
                
                expContainer.classList.remove('hidden');
                if (isCorrect) {
                    expContainer.classList.add('border-green-500', 'bg-green-50/50');
                } else {
                    expContainer.classList.add('border-red-500', 'bg-red-50/50');
                }
                expText.innerHTML = question.opcoes[correctIndex].explicacao;
            },

            finalizarAula() {
                const total = this.respostas.length;
                let respondidas = 0;
                let acertos = 0;

                this.respostas.forEach((r, i) => {
                    if (r !== null) {
                        respondidas++;
                        if (aulasDatabase[this.currentLessonId].questoes[i].opcoes[r].correta) {
                            acertos++;
                        }
                    }
                });

                if (respondidas < total) {
                    if (!confirm(`Você respondeu ${respondidas} de ${total} questões. Deseja finalizar mesmo assim?`)) {
                        return;
                    }
                }

                this.showDiagnostic(acertos, total);
            },

            showDiagnostic(acertos, total) {
                const modal = document.getElementById('diagnostic-modal');
                const content = document.getElementById('diagnostic-content');
                
                const pct = Math.round((acertos / total) * 100) || 0;
                let title, color, message, weaknesses;

                if (pct >= 80) {
                    title = "Excelente Desempenho!"; color = "text-green-600";
                    message = "Você demonstrou domínio sólido sobre os ciclos dos vetores e características clínicas.";
                    weaknesses = "Atenção apenas aos detalhes minuciosos de notificações compulsórias.";
                } else if (pct >= 50) {
                    title = "Bom Trabalho, mas há espaço para melhorar."; color = "text-yellow-500";
                    message = "Você acertou as questões fáceis, mas a banca vai tentar te pegar nas médias e difíceis.";
                    weaknesses = "Revise urgentemente as diferenças clínicas entre Dengue, Zika e Chikungunya e o LIRAa.";
                } else {
                    title = "Atenção: Necessário Revisão Urgente!"; color = "text-red-600";
                    message = "O conteúdo ainda não está fixado. Não avance no cronograma antes de dominar isso.";
                    weaknesses = "Retorne à leitura atenta do ciclo do Aedes e métodos mecânicos x químicos de controle.";
                }

                content.innerHTML = `
                    <div class="text-center">
                        <h2 class="text-3xl font-black ${color} mb-2">${title}</h2>
                        <div class="text-6xl font-black text-slate-800 my-6">${acertos} <span class="text-3xl text-slate-400">/ ${total}</span></div>
                        
                        <div class="bg-slate-50 rounded-xl p-6 text-left space-y-4 mb-8 border border-slate-200">
                            <div>
                                <h4 class="font-bold text-slate-900 uppercase text-xs tracking-wider mb-1"><i class="ph-fill ph-trend-up text-green-500"></i> Pontos Fortes</h4>
                                <p class="text-slate-700">${message}</p>
                            </div>
                            <div>
                                <h4 class="font-bold text-slate-900 uppercase text-xs tracking-wider mb-1"><i class="ph-fill ph-warning-circle text-red-500"></i> Pontos a Melhorar</h4>
                                <p class="text-slate-700">${weaknesses}</p>
                            </div>
                        </div>

                        <div class="bg-blue-900 text-white p-6 rounded-xl italic">
                            "A aprovação é construída nos dias em que você está cansado, mas decide estudar mesmo assim. O cargo de ACE em Assunção já é seu, futuro servidor. Mantenha o foco!"
                        </div>
                        
                        <button onclick="app.closeDiagnostic()" class="mt-8 w-full py-4 bg-slate-800 text-white font-bold rounded-xl hover:bg-slate-700 transition-colors">Voltar ao Cronograma</button>
                    </div>
                `;
                
                modal.classList.add('active');
            },

            closeDiagnostic() {
                document.getElementById('diagnostic-modal').classList.remove('active');
                this.switchTab('cronograma');
                window.scrollTo(0,0);
            }
        };

        // Inicializa o app ao carregar
        window.onload = () => app.init();
    </script>
</body>
</html>
